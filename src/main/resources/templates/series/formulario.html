<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
	
<head>
	<meta charset="UTF-8">
	<title>Edição de Série</title>
</head>

<body>
	<form th:action="@{/paginas/series/novo}" th:object="${serie}" method="post">
	
		<p>
			<label>Nome</label>
			<input type="text" th:field="*{nome}">
		</p>
		
		<p>
			<label>Plataforma</label>
			<input type="text" th:field="*{plataforma}">
		</p>
		
		<p>
			<label>Gênero</label>
			<input type="text" th:field="*{genero}">
		</p>
		
		<p>
			<label>Ano de Lançamento</label>
			<input type="number" th:field="*{anoLancamento}">
		</p>
		
		<button type="submit">Salvar</button>
		<a th:href="@{/paginas/series}">Cancelar</a>
		
		</form>
		</body>
		</html>
